[project]
name = "aiecon"
version = "0.1.1"
description = "Reconstruct AI workflow costs, reconcile them with provider reports, and inspect evidence-backed waste and context reuse opportunities."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "longlongwan" }]
keywords = ["llm", "cost", "finops", "litellm", "openai", "anthropic", "duckdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.9,<3",
  "duckdb>=1.1",
  "typer>=0.15",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
live = ["litellm[proxy]==1.102.1"]

[project.scripts]
aiecon = "aiecon.cli:app"

[project.urls]
Homepage = "https://github.com/wanlonghenry/aiecon"
Issues = "https://github.com/wanlonghenry/aiecon/issues"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiecon"]

[tool.hatch.build.targets.sdist]
include = ["src/aiecon", "tests", "catalogs", "docs", "examples", "README.md", "LICENSE", "PLAN.md", "AGENTS.md", "KNOWN_LIMITATIONS.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".aiecon"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real provider APIs; excluded from default CI"]
